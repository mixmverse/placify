<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placify Logo Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      color: white; 
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
    }
    h1 { text-align: center; margin-bottom: 40px; font-size: 24px; opacity: 0.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
    }
    .card img { max-width: 100%; height: auto; }
    .card h2 { margin-top: 20px; font-size: 14px; opacity: 0.5; }
    .dark-bg { background: #111; }
    .light-bg { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Placify Logo Variants</h1>
  <div class="grid">
    <div class="card dark-bg">
      <img src="logo.svg" alt="Placify Logo" style="max-width: 160px;">
      <h2>Logo (icon + glow)</h2>
    </div>
    <div class="card dark-bg">
      <img src="logo-icon.svg" alt="Placify Icon" style="max-width: 160px;">
      <h2>Icon (clean)</h2>
    </div>
    <div class="card dark-bg">
      <img src="logo-full.svg" alt="Placify Full" style="max-width: 320px;">
      <h2>Full logo (icon + wordmark)</h2>
    </div>
  </div>
  <div class="grid" style="margin-top: 40px;">
    <div class="card light-bg">
      <img src="logo-icon.svg" alt="Placify on light" style="max-width: 160px;">
      <h2 style="color: #333;">On light background</h2>
    </div>
    <div class="card" style="background: linear-gradient(135deg, #10b981, #06b6d4);">
      <img src="logo-icon.svg" alt="Placify on brand" style="max-width: 160px; filter: brightness(0) invert(1);">
      <h2>On brand gradient</h2>
    </div>
    <div class="card dark-bg">
      <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
        <img src="logo-icon.svg" alt="" style="width: 40px;">
        <span style="font-size: 28px; font-weight: 700;">Placify</span>
      </div>
      <h2>In-header usage</h2>
    </div>
  </div>
</body>
</html>
